name: Weekly Search Agent

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '22'

      - name: Run search agent
        run: node weekly-search-agent.js
        env:
          OUTPUT_DIR: ./reports

      - name: Commit and push results
        run: |
          git config user.name "Search Agent Bot"
          git config user.email "bot@example.com"
          git add reports/
          git commit -m "chore: update weekly search report [automated]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
