name: Weekly Search Agent

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm install

      - run: node weekly-search-agent.js
        env:
          OUTPUT_DIR: ./reports

      - run: |
          git config user.name "Search Agent Bot"
          git config user.email "bot@example.com"
          git add reports/
          git commit -m "chore: update weekly search report [automated]" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
