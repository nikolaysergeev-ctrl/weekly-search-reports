name: Clean Entities (One-Time)

on:
  workflow_dispatch:  # manual trigger only - this is NOT scheduled

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run entity cleanup script
        run: node clean_entities.js

      - name: Commit and push results
        run: |
          git config user.name "Search Agent Bot"
          git config user.email "bot@example.com"
          git add known_sources.json
          git commit -m "chore: decode HTML entities in titles/descriptions [one-time]" || echo "No changes"
          git pull --rebase origin main
          git push