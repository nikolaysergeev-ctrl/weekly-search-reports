name: Classify Legacy Topics (One-Time)

on:
  workflow_dispatch:  # manual trigger only - this is NOT scheduled

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run classification script
        run: node classify_topics.js

      - name: Commit and push results
        run: |
          git config user.name "Search Agent Bot"
          git config user.email "bot@example.com"
          git add known_sources.json
          git commit -m "chore: classify legacy sources into topic categories [one-time]" || echo "No changes"
          git push