name: Weekly Search Agent

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm install

      - run: mkdir -p reports

      - run: node weekly-search-agent/weekly-search-agent.js

        env:
          OUTPUT_DIR: ./reports
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}

      - run: |
          git config user.name "Search Agent Bot"
          git config user.email "bot@example.com"
          git add reports/
          git commit -m "Weekly report update" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
