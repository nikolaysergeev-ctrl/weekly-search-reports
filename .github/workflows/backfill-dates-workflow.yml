name: Backfill Dates (One-Time)

on:
  workflow_dispatch:  # manual trigger only - this is NOT scheduled

jobs:
  backfill-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run date backfill script
        run: node backfill_dates.js

      - name: Commit and push results
        run: |
          git config user.name "Search Agent Bot"
          git config user.email "bot@example.com"
          git add known_sources.json
          git commit -m "chore: backfill publish dates for sources [one-time]" || echo "No changes"
          git push